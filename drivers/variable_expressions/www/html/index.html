<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Variable Expressions</title>
  <style>
<!-- #embed ../../../../src/lib/ui/style.css -->
<!-- #embed ../../../../src/lib/ui/variables.css -->
<!-- #embed ../../../../src/lib/ui/expressions.css -->


    .expr-rendered { font-family: var(--mono); font-size: 10.5px; color: var(--text-muted); }
    .res { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
    #watch-count { margin-left: 6px; }
  </style>
</head>
<body>

<div class="nav" id="nav">
  <div class="nav-tab active" data-panel="list">Expressions</div>
  <span class="nav-meta" id="nav-meta">Variable Expressions</span>
</div>

<!-- ── List panel ─────────────────────────────────────────────── -->
<div class="panel active" id="panel-list">
  <div class="card" id="props-card" hidden>
    <h3>Properties</h3>
    <div id="props"></div>
  </div>

  <div class="card">
    <h3>Expressions <button class="btn btn-primary btn-sm" onclick="openEditor(null)">+ Add Expression</button></h3>
    <div class="table-wrap">
      <table id="expr-table">
        <thead>
          <tr>
            <th style="width:22%;">Name</th>
            <th class="kit-hide-md" style="width:84px;">Mode</th>
            <th>Expression</th>
            <th style="width:16%;">Last Result</th>
            <th class="kit-hide-sm" style="width:88px;">Recompute</th>
            <!-- Run + Edit + delete need 130px; a narrower fixed column pushes
                 the delete button past the table edge, where table-wrap clips it. -->
            <th style="width:140px;"></th>
          </tr>
        </thead>
        <tbody id="expr-rows"></tbody>
      </table>
    </div>
    <div class="empty" id="expr-empty" style="display:none;">No expressions yet. Add Expression to create one.</div>
    <p class="hint">Each expression publishes a variable named <code>&lt;Name&gt; Result</code> and fires the <code>&lt;Name&gt; Calculated</code> event after every run.</p>
  </div>
</div>

<!-- ── Editor panel ───────────────────────────────────────────── -->
<div class="panel" id="panel-editor">
  <div class="kit-split">

    <div class="card kit-split-side">
      <h3>Variables</h3>
      <div id="vb"></div>
    </div>

    <div class="kit-split-main">
      <div class="card">
        <div class="kit-fields">
          <div>
            <label for="expr-name">Name</label>
            <input type="text" id="expr-name" placeholder="e.g. Bathroom Humidity Diff" oninput="this.classList.remove('input-error')"/>
          </div>
          <div style="flex:none;">
            <label>Mode</label>
            <div class="seg">
              <button type="button" id="mode-equation" class="on" onclick="setMode('equation')">Equation</button>
              <button type="button" id="mode-string" onclick="setMode('string')">String</button>
            </div>
          </div>
        </div>
        <div class="kit-label-row">
          <label for="expr-template">Expression</label>
          <button type="button" id="help-toggle">Syntax help</button>
        </div>
        <textarea id="expr-template" rows="3" placeholder="abs(PARAM{96,1002} - PARAM{97,1002})"></textarea>
        <div id="help-panel"></div>
      </div>

      <div id="preview">
        <div class="kit-prev-foot" id="prev-pub"></div>
      </div>

      <div class="kit-foot">
        <div style="margin-right:auto;">
          <label class="check"><input type="checkbox" id="expr-auto" checked/>
            Recalculate when referenced variables change</label><span class="hint" id="watch-count"></span>
        </div>
        <span style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; min-width:0;">
          <span class="save-error" id="save-error"></span>
          <button class="btn btn-outline" onclick="closeEditor()">Cancel</button>
          <button class="btn btn-outline" title="Evaluate now without saving" onclick="editor.preview(true)">Run Once</button>
          <button class="btn btn-primary" onclick="saveExpression()">Save Expression</button>
        </span>
      </div>
    </div>

  </div>
</div>

<script>
<!-- #embed ../../../../src/lib/ui/page.js -->
<!-- #embed ../../../../src/lib/ui/variables.js -->
<!-- #embed ../../../../src/lib/ui/expressions.js -->
var sendCommand = Kit.sendCommand, esc = Kit.esc, gDriverId = Kit.driverId;

var DRIVER_HANDLERS = {
  CONFIG_DATA: function (data) { onConfig(data.expressions); },
  EXPRESSION_RESULT: onExpressionResult,
  SAVE_RESULT: onSaveResult,
};

// ============================================================
// State
// ============================================================
var gExpressions = [];           // [{name, mode, template, auto, watched, result, error, rendered, ts}]
var gEditor = { open: false, originalName: '', mode: 'equation' };

var editor = Kit.expressionEditor(document.getElementById('expr-template'), {
  preview: document.getElementById('preview'),
  watch: document.getElementById('watch-count'),
  help: { toggle: document.getElementById('help-toggle'), panel: document.getElementById('help-panel') },
});
var browser = Kit.variableBrowser(document.getElementById('vb'), { target: '#expr-template' });

// ============================================================
// List view
// ============================================================
function onConfig(expressions) {
  gExpressions = Array.isArray(expressions) ? expressions : [];
  renderList();
}

function renderList() {
  var tb = document.getElementById('expr-rows');
  var empty = document.getElementById('expr-empty');
  if (!gExpressions.length) {
    tb.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  var html = '';
  gExpressions.forEach(function(x) {
    var dot = x.error ? 'status-warn' : (x.result != null && x.result !== '' ? 'status-ok' : 'status-none');
    var modeChip = x.mode === 'string' ? '<span class="chip green">STRING</span>' : '<span class="chip blue">NUMBER</span>';
    var resCell;
    if (x.error) resCell = '<span class="chip chip-err" title="' + esc(x.error) + '">' + esc(shortError(x.error)) + '</span>';
    else if (x.result != null && x.result !== '') resCell = '<span class="res" title="' + esc(Kit.ago(x.ts)) + '">' + esc(x.result) + '</span>';
    else resCell = '<span class="res" style="color:var(--text-muted);">-</span>';
    var autoChip = x.auto ? '<span class="chip purple">Auto</span>' : '<span class="chip gray">Manual</span>';
    html += '<tr data-name="' + esc(x.name) + '">'
      + '<td class="trunc" title="' + esc(x.name) + '"><span class="status-dot ' + dot + '"></span><b>' + esc(x.name) + '</b></td>'
      + '<td class="kit-hide-md">' + modeChip + '</td>'
      + '<td class="trunc"><span class="expr-rendered" title="' + esc(x.rendered || x.template) + '">' + esc(x.rendered || x.template) + '</span></td>'
      + '<td class="cell-result trunc">' + resCell + '</td>'
      + '<td class="kit-hide-sm">' + autoChip + '</td>'
      + '<td style="text-align:right; white-space:nowrap;">'
      + '<button class="btn btn-outline btn-sm" title="Recalculate now" data-act="run">&#9654; Run</button> '
      + '<button class="btn btn-ghost" data-act="edit">Edit</button>'
      + '<button class="btn btn-ghost" title="Delete" data-act="delete">&#10005;</button>'
      + '</td></tr>';
  });
  tb.innerHTML = html;
}

document.getElementById('expr-rows').addEventListener('click', function(e) {
  var button = e.target.closest('[data-act]');
  if (!button) return;
  var name = button.closest('tr').getAttribute('data-name');
  var act = button.getAttribute('data-act');
  if (act === 'run') runExpression(name);
  else if (act === 'edit') editExpression(name);
  else if (act === 'delete') deleteExpression(name);
});

function shortError(err) {
  err = String(err || '');
  if (/unresolved|not found/.test(err)) return 'Unresolved reference';
  if (err.indexOf('removed') !== -1) return 'Device removed';
  return 'Error';
}

function onExpressionResult(p) {
  var found = false;
  gExpressions.forEach(function(x) {
    if (x.name === p.name) {
      x.result = p.result; x.error = p.error || null; x.rendered = p.rendered || x.rendered; x.ts = p.ts;
      found = true;
    }
  });
  if (found) renderList();
  else sendCommand('_GET_CONFIG');
}

function runExpression(name) { sendCommand('_RUN_EXPRESSION', { name: name }); }

function deleteExpression(name) {
  if (!window.confirm('Delete expression "' + name + '"? Its output variable and event are removed.')) return;
  sendCommand('_DELETE_EXPRESSION', { name: name });
}

function editExpression(name) {
  var x = null;
  gExpressions.forEach(function(e) { if (e.name === name) x = e; });
  openEditor(x);
}

// ============================================================
// Editor view
// ============================================================
function openEditor(expr) {
  gEditor.open = true;
  gEditor.originalName = expr ? expr.name : '';
  document.getElementById('expr-name').value = expr ? expr.name : '';
  document.getElementById('expr-auto').checked = expr ? !!expr.auto : true;
  document.getElementById('save-error').textContent = '';
  document.getElementById('panel-list').classList.remove('active');
  document.getElementById('panel-editor').classList.add('active');
  setMode(expr && expr.mode === 'string' ? 'string' : 'equation');
  editor.setValue(expr ? expr.template : '');
  // Unguarded: the list must refresh on every open, not just populate once.
  browser.refresh();
  document.getElementById('expr-name').focus();
}

function closeEditor() {
  gEditor.open = false;
  document.getElementById('panel-editor').classList.remove('active');
  document.getElementById('panel-list').classList.add('active');
}

function setMode(mode) {
  gEditor.mode = mode;
  document.getElementById('mode-equation').className = mode === 'equation' ? 'on' : '';
  document.getElementById('mode-string').className = mode === 'string' ? 'on' : '';
  editor.setMode(mode);
  updatePublishLine();
}

function updatePublishLine() {
  var name = document.getElementById('expr-name').value.trim() || 'Expression';
  document.getElementById('prev-pub').innerHTML =
    'Publishes <code>' + esc(name) + ' Result</code> (' + (gEditor.mode === 'string' ? 'STRING' : 'NUMBER')
    + ' variable) &middot; <code>' + esc(name) + ' Calculated</code> (event)';
}

function saveExpression() {
  var nameInput = document.getElementById('expr-name');
  var name = nameInput.value.trim();
  var template = editor.value().trim();
  var errEl = document.getElementById('save-error');
  errEl.textContent = '';
  if (!name) { nameInput.classList.add('input-error'); errEl.textContent = 'Name is required.'; return; }
  if (!template) { errEl.textContent = 'Expression is required.'; return; }
  var isRename = gEditor.originalName && gEditor.originalName !== name;
  var clash = gExpressions.some(function(x) { return x.name === name && gEditor.originalName !== name; });
  if (clash && (isRename || !gEditor.originalName)) {
    if (!window.confirm('An expression named "' + name + '" already exists. Overwrite it?')) return;
  }
  sendCommand('_SAVE_EXPRESSION', {
    name: name,
    originalName: gEditor.originalName,
    mode: gEditor.mode,
    template: template,
    auto: document.getElementById('expr-auto').checked
  });
  closeEditor();
}

function onSaveResult(p) {
  if (p.ok === false) {
    // Reopen the editor state message on validation failure
    document.getElementById('panel-list').classList.remove('active');
    document.getElementById('panel-editor').classList.add('active');
    document.getElementById('save-error').textContent = p.error || 'Save failed';
  }
}

// ============================================================
// Demo data, outside Composer
// ============================================================
var DEMO_NOW = Math.floor(Date.now() / 1000);
var DEMO_EXPRESSIONS = [
  { name: 'Bathroom Humidity Diff', mode: 'equation', auto: true, ts: DEMO_NOW,
    template: 'abs(PARAM{96,1002} - PARAM{97,1002})', result: '7.6',
    rendered: 'abs([Master Bathroom > Bath Humidity Sensor > HUMIDITY] - [Upstairs Hallway > Hall Humidity Sensor > HUMIDITY])' },
  { name: 'Espresso Status', mode: 'string', auto: true, ts: DEMO_NOW,
    template: 'Espresso machine: PARAM{105,1017} W', result: 'Espresso machine: 1343 W',
    rendered: 'Espresso machine: [Kitchen > Demo Power Strip > Outlet 5 Power] W' },
  { name: 'Christmas Lights Hours', mode: 'equation', auto: false, ts: DEMO_NOW,
    template: 'PARAM{140,1003} / 24', error: 'unresolved variable reference',
    rendered: '[Device 140 > TOTAL_ON_HOURS] / 24' }
];
var DEMO_DEVICES = [
  { id: 105, name: 'Demo Power Strip', roomName: 'Kitchen' },
  { id: 96, name: 'Bath Humidity Sensor', roomName: 'Master Bathroom' },
  { id: 97, name: 'Hall Humidity Sensor', roomName: 'Upstairs Hallway' }
];
var DEMO_VARIABLES = {
  96: [
    { id: 1002, name: 'HUMIDITY', type: 'NUMBER', value: '61.8' },
    { id: 1001, name: 'TEMPERATURE', type: 'NUMBER', value: '74.2' }
  ],
  97: [
    { id: 1003, name: 'BATTERY_LEVEL', type: 'NUMBER', value: '88' },
    { id: 1002, name: 'HUMIDITY', type: 'NUMBER', value: '54.2' }
  ],
  105: [
    { id: 1017, name: 'Outlet 5 Power', type: 'NUMBER', value: '1342.6' },
    { id: 1014, name: 'Voltage', type: 'NUMBER', value: '122' }
  ]
};
// The previews the demo expressions get, as the driver answers them.
var DEMO_PREVIEWS = {
  'abs(PARAM{96,1002} - PARAM{97,1002})': { result: '7.6', substituted: 'abs(61.8 - 54.2)',
    rendered: 'abs([Master Bathroom > Bath Humidity Sensor > HUMIDITY] - [Upstairs Hallway > Hall Humidity Sensor > HUMIDITY])' },
  'Espresso machine: PARAM{105,1017} W': { result: 'Espresso machine: 1342.6 W', substituted: 'Espresso machine: 1342.6 W',
    rendered: 'Espresso machine: [Kitchen > Demo Power Strip > Outlet 5 Power] W' },
  'PARAM{140,1003} / 24': { substituted: 'ERROR_VARIABLE_NOT_FOUND / 24', error: 'device 140 not found',
    rendered: '[Device 140 > 1003] / 24' }
};
var DEMO_PROPERTIES = [
  // #ifdef DRIVERCENTRAL
  { group: 'Cloud Settings', name: 'Cloud Status', value: 'License Activated', readonly: true },
  // #endif
  { group: 'Cloud Settings', name: 'Automatic Updates', value: 'On', choices: ['Off', 'On'] },
  // #ifndef DRIVERCENTRAL
  { group: 'Cloud Settings', name: 'Update Channel', value: 'Production', choices: ['Production', 'Prerelease'] },
  // #endif
  { group: 'Driver Settings', name: 'Driver Status', value: 'Ready', readonly: true },
  { group: 'Driver Settings', name: 'Driver Version', value: '20261105', readonly: true },
  // #ifdef DRIVERCENTRAL
  { group: 'Driver Settings', name: 'Log Level', value: '3 - Info', choices: ['0 - Fatal', '1 - Error', '2 - Warning', '3 - Info', '4 - Debug'] },
  // #else
  { group: 'Driver Settings', name: 'Log Level', value: '3 - Info', choices: ['0 - Fatal', '1 - Error', '2 - Warning', '3 - Info', '4 - Debug', '5 - Trace', '6 - Ultra'] },
  // #endif
  { group: 'Driver Settings', name: 'Log Mode', value: 'Off', choices: ['Off', 'Print', 'Log', 'Print and Log'] },
  // #ifdef DRIVERCENTRAL
  { group: 'Driver Settings', name: 'Cloud Monitoring', value: 'Enabled', choices: ['Disabled', 'Enabled'], description: 'Sends memory and error reports to Finite Labs so we can fix driver problems.' },
  // #endif
];

function demoAnswer(command, params) {
  if (command === '_GET_CONFIG') Kit.deliver('CONFIG_DATA', { expressions: DEMO_EXPRESSIONS });
  else if (command === '_GET_PROPERTIES') Kit.deliver('PROPERTIES', { properties: DEMO_PROPERTIES });
  else if (command === '_EVAL_EXPRESSION') {
    var preview = DEMO_PREVIEWS[params.expression] || { error: 'Opened outside Composer, only the demo expressions preview.' };
    Kit.deliver('EVAL_RESULT', Object.assign({ id: params.id, rendered: '', substituted: '', result: '', error: '' }, preview));
  }
}

// ============================================================
// Boot
// ============================================================
Kit.initTabs(closeEditor);
Kit.initPropertiesCard(document.getElementById('props'));
document.getElementById('nav-meta').textContent = 'Variable Expressions' + (gDriverId ? ' · device ' + gDriverId : '');
document.getElementById('expr-name').addEventListener('input', updatePublishLine);
if (Kit.demoMode(demoAnswer)) {
  Kit.devices.demo(DEMO_DEVICES, DEMO_VARIABLES);
}
Kit.connectDriver({
  handlers: DRIVER_HANDLERS,
  onConnect: function () {
    sendCommand('_GET_CONFIG');
    browser.refresh();
  }
});
// Keeps the relative times fresh.
setInterval(function() { if (!gEditor.open) { sendCommand('_GET_CONFIG'); renderList(); } }, 30000);
</script>
</body>
</html>
